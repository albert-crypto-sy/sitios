<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Chistes Malísimos</title>
  <meta name="description" content="Una colección de chistes cortos, absurdos y con juegos de palabras, en español.">
  <meta name="theme-color" content="#ffcf3f">
  <!-- publicado con sitios -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A6%99%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <p class="kicker">🦙 recopilatorio oficial de</p>
    <h1>Chistes<br><span>Malísimos</span></h1>
    <p class="sub">Absurdos, juegos de palabras y remates que no deberían funcionar. Pulsa, ríete (o no) y pasa al siguiente.</p>
  </header>

  <main>
    <section class="escenario" aria-live="polite">
      <article class="tarjeta" id="tarjeta">
        <span class="etiqueta" id="etiqueta"></span>
        <p class="planteamiento" id="planteamiento"></p>
        <p class="remate" id="remate" hidden></p>
        <div class="acciones">
          <button class="btn principal" id="revelar">¿Y…?</button>
          <button class="btn" id="siguiente">Otro chiste →</button>
        </div>
        <div class="extra">
          <button class="mini" id="risa" aria-pressed="false">😂 <span id="risas">Me ha hecho gracia</span></button>
          <button class="mini" id="compartir">Compartir</button>
          <span class="contador" id="contador"></span>
        </div>
      </article>
    </section>

    <section class="coleccion">
      <div class="filtros" id="filtros" role="toolbar" aria-label="Filtrar por tipo"></div>
      <input class="buscar" id="buscar" type="search" placeholder="Buscar un chiste…" aria-label="Buscar un chiste">
      <ol class="lista" id="lista"></ol>
      <p class="vacio" id="vacio" hidden>Ningún chiste habla de eso. Todavía.</p>
    </section>
  </main>

  <footer>Chistes originales, escritos para esta web. Si no te ríes, la culpa es del remate.</footer>

  <script src="chistes.js"></script>
  <script src="app.js"></script>
</body>
</html>
