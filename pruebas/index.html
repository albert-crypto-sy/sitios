<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Lila la unicornia</title>
  <meta name="description" content="Un juego tierno y fácil para peques: Lila la unicornia, su castillo y muchas sorpresas.">
  <meta name="theme-color" content="#cfe9ff">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='36' r='22' fill='%23fff' stroke='%235b4370' stroke-width='3'/%3E%3Cpath d='M30 16 L36 2 L40 18 Z' fill='%23ffd86b' stroke='%235b4370' stroke-width='2.5' stroke-linejoin='round'/%3E%3Ccircle cx='18' cy='26' r='9' fill='%23c9a7f5'/%3E%3Ccircle cx='38' cy='36' r='4' fill='%235b4370'/%3E%3Cellipse cx='44' cy='44' rx='5' ry='3' fill='%23ffb6d9'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="screen" aria-label="Lila la unicornia, juego para peques"></canvas>

  <button class="mute" id="mute" aria-label="Sonido">🔊</button>

  <div class="touch" aria-hidden="true">
    <div class="pad">
      <button class="up" data-key="up">▲</button>
      <button class="left" data-key="left">◀</button>
      <button class="right" data-key="right">▶</button>
      <button class="down" data-key="down">▼</button>
    </div>
    <button class="jump" data-key="jump">♥</button>
  </div>

  <script src="game.js" defer></script>
</body>
</html>
