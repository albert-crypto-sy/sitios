<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Neón Bros</title>
  <meta name="description" content="Un plataformas sencillo en pixel art neón. Corre, salta y llega a la bandera.">
  <meta name="theme-color" content="#07021a">
  <!-- publicado con sitios -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect width='16' height='16' fill='%2307021a'/%3E%3Crect x='4' y='2' width='8' height='3' fill='%23ff2bd6'/%3E%3Crect x='4' y='5' width='7' height='4' fill='%23ffd1a8'/%3E%3Crect x='4' y='9' width='8' height='4' fill='%2300f0ff'/%3E%3Crect x='3' y='13' width='4' height='2' fill='%23ffe600'/%3E%3Crect x='9' y='13' width='4' height='2' fill='%23ffe600'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="screen" aria-label="Neón Bros, juego de plataformas"></canvas>

  <div class="touch" aria-hidden="true">
    <div class="pad">
      <button data-key="left">◀</button>
      <button data-key="right">▶</button>
    </div>
    <button class="jump" data-key="jump">▲</button>
  </div>

  <script src="game.js" defer></script>
</body>
</html>
